📄 ingress.yaml
```bash
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-example
spec:
  rules:
    - host: mario.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingress-service
                port:
                  number: 80
'''
---------------done------------------------
  📄 ingress-service.yaml
```bash
apiVersion: v1
kind: Service
metadata:
  name: ingress-service
spec:
  selector:
    app: ingress-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
'''

  dosent use deployment file

  ingress-deployment.yaml
```bash
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingress-app
  template:
    metadata:
      labels:
        app: ingress-app
    spec:
      containers:
        - name: mario
          image: harshalgit/super-mario
          ports:
            - containerPort: 80
'''
